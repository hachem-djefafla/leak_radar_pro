name: leak_radar_pro
description: >-
  On-device memory-leak detector for Flutter: tracks per-class heap growth and
  object retention, with an inspector and DevTools extension. No-op in release.
version: 0.1.0
repository: https://github.com/hachem-djefafla/leak_radar_pro
issue_tracker: https://github.com/hachem-djefafla/leak_radar_pro/issues
homepage: https://github.com/hachem-djefafla/leak_radar_pro
topics:
  - memory
  - leak-detection
  - debugging
  - devtools
  - performance
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  vm_service: ^15.0.0
  meta: ^1.15.0
  share_plus: ">=10.0.0 <14.0.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
